<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kids Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="center-text">Kids Collection</h2>

<div class="products selectable">

    <!-- Kids T-Shirt (FIXED IMAGE) -->
    <input type="radio" name="kids" id="k1">
    <label for="k1" class="card">
        <img src="https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?w=400"
             alt="Kids T-Shirt">
        <h3>Kids T-Shirt</h3>
        <p>
            <span class="price">₹499</span>
        </p>
        <p>⭐⭐⭐⭐☆ (4.2)</p>
    </label>

    <!-- Kids Shoes -->
    <input type="radio" name="kids" id="k2">
    <label for="k2" class="card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
             alt="Kids Shoes">
        <h3>Kids Shoes</h3>
        <p>
            <span class="price">₹799</span>
        </p>
        <p>⭐⭐⭐⭐⭐ (4.8)</p>
    </label>

</div>

</body>
</html>
